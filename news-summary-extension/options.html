<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API配置 - AI新闻总结小助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      padding: 20px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card h2::before {
      content: "⚙️";
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group input.error {
      border-color: #e74c3c;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f5f7fa;
      color: #667eea;
      border: 1px solid #667eea;
    }

    .btn-secondary:hover {
      background: #e8ebf0;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .api-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .api-item {
      background: #f8f9fa;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .api-item:hover {
      background: #f0f2f5;
    }

    .api-item.selected {
      border-color: #667eea;
      background: #f0f4ff;
    }

    .api-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .api-item-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .api-item-type {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #667eea;
      color: white;
    }

    .api-item-info {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .api-item-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .api-item-actions .btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .add-api-card h2::before {
      content: "+";
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .action-buttons .btn {
      flex: 1;
    }

    .hidden {
      display: none !important;
    }

    .edit-mode .api-item-actions {
      display: none;
    }

    .api-item-edit-form {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .api-item-edit-form .form-group {
      margin-bottom: 12px;
    }

    .api-item-edit-form input {
      font-size: 13px;
      padding: 8px 10px;
    }

    .api-item-edit-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ API配置</h1>
      <p>管理您的大模型API配置，支持多个API渠道</p>
    </div>

    <div class="message" id="message"></div>

    <div class="main-content">
      <div class="card">
        <h2>已配置的API</h2>
        <div class="api-list" id="apiList">
          <div class="empty-state">
            <p>暂无API配置</p>
            <button class="btn btn-primary" onclick="showAddForm()">添加第一个API</button>
          </div>
        </div>
        <div class="action-buttons" style="margin-top: 20px;">
          <button class="btn btn-secondary" onclick="showAddForm()">+ 添加API</button>
        </div>
      </div>

      <div class="card add-api-card" id="addApiCard">
        <h2>添加新API</h2>
        <form id="apiForm">
          <div class="form-group">
            <label for="apiName">配置名称 *</label>
            <input type="text" id="apiName" placeholder="例如：OpenAI、Claude、Gemini等" required>
          </div>

          <div class="form-group">
            <label for="apiType">API类型 *</label>
            <select id="apiType" required>
              <option value="">请选择类型</option>
              <option value="openai">OpenAI</option>
              <option value="claude">Claude</option>
              <option value="gemini">Gemini</option>
              <option value="other">其他兼容API</option>
            </select>
          </div>

          <div class="form-group">
            <label for="apiUrl">API地址 *</label>
            <input type="url" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" required>
          </div>

          <div class="form-group">
            <label for="apiKey">API Key *</label>
            <input type="password" id="apiKey" placeholder="sk-..." required>
          </div>

          <div class="form-group">
            <label for="apiModel">模型名称 *</label>
            <input type="text" id="apiModel" placeholder="gpt-4o-mini、gpt-3.5-turbo等" required>
          </div>

          <input type="hidden" id="editApiId" value="">

          <div class="action-buttons">
            <button type="button" class="btn btn-secondary" onclick="cancelEdit()">取消</button>
            <button type="submit" class="btn btn-primary">保存配置</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
