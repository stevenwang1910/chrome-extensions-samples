<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI新闻总结助手</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="#4CAF50"/>
          <path d="M14 2V8H20" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 13H8" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 17H8" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 9H9H8" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>AI新闻总结</span>
      </div>
      <button class="settings-btn" id="settingsBtn" title="打开设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- 主要内容区 -->
    <main class="main-content">
      <!-- 初始状态 -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5">
            <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z"/>
            <path d="M14 2V8H20"/>
            <path d="M16 13H8"/>
            <path d="M16 17H8"/>
            <path d="M10 9H9H8"/>
          </svg>
        </div>
        <p class="empty-text">点击"总结当前页面"按钮<br>开始分析新闻内容</p>
      </div>

      <!-- 加载状态 -->
      <div class="loading-state hidden" id="loadingState">
        <div class="spinner"></div>
        <p class="loading-text">正在分析文章内容...</p>
        <p class="loading-subtext">AI正在为您生成摘要</p>
      </div>

      <!-- 结果展示 -->
      <div class="result-state hidden" id="resultState">
        <div class="article-info">
          <h2 class="article-title" id="articleTitle"></h2>
          <div class="article-meta">
            <span id="articleSource"></span>
            <span id="articleTime"></span>
          </div>
        </div>

        <div class="summary-section">
          <div class="section-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2">
              <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z"/>
              <path d="M14 2V8H20"/>
              <path d="M16 13H8"/>
              <path d="M16 17H8"/>
              <path d="M10 9H9H8"/>
            </svg>
            <span>AI摘要</span>
          </div>
          <div class="summary-content" id="summaryContent"></div>
          <div class="summary-stats">
            <span id="summaryLength"></span>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="copyBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制摘要
          </button>
          <button class="btn btn-primary" id="regenerateBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            重新生成
          </button>
        </div>
      </div>

      <!-- 错误状态 -->
      <div class="error-state hidden" id="errorState">
        <div class="error-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f44336" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <p class="error-title">生成摘要失败</p>
        <p class="error-message" id="errorMessage"></p>
        <button class="btn btn-primary" id="retryBtn">重试</button>
      </div>
    </main>

    <!-- 底部操作栏 -->
    <footer class="footer">
      <button class="summarize-btn" id="summarizeBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z"/>
          <path d="M14 2V8H20"/>
          <path d="M16 13H8"/>
          <path d="M16 17H8"/>
          <path d="M10 9H9H8"/>
        </svg>
        总结当前页面
      </button>
    </footer>
  </div>

  <!-- 提示消息 -->
  <div class="toast" id="toast"></div>

  <script src="index.js"></script>
</body>
</html>
