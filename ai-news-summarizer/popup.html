<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Summarizer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI News Summarizer</h1>
            <p>智能总结新闻内容</p>
        </div>
        <div class="article-title">
            <h2 id="title">-</h2>
        </div>
        <div class="summary-container">
            <div class="summary-content" id="summary">点击"总结"按钮开始...</div>
        </div>
        <div class="controls">
            <button class="button button-primary" id="summarizeBtn">总结</button>
            <button class="button button-secondary" id="copyBtn" disabled>复制</button>
        </div>
        <div class="settings-link">
            <a href="#" id="settingsLink">设置</a>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
