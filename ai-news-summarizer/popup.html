<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI新闻总结小助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }
    
    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }
    
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .tab:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .tab.active {
      background: white;
      color: #667eea;
      font-weight: 600;
    }
    
    .tab-content {
      display: none;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    .tab-content.active {
      display: block;
    }
    
    .summary-section {
      margin-bottom: 15px;
    }
    
    .summary-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .summary-content {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      min-height: 100px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .summary-content.loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }
    
    .summary-content.error {
      color: #dc3545;
      background: #f8d7da;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #5a6268;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
      font-weight: 600;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .api-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 15px;
    }
    
    .api-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #e9ecef;
    }
    
    .api-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .api-item-name {
      font-weight: 600;
      font-size: 14px;
      color: #333;
    }
    
    .api-item-actions {
      display: flex;
      gap: 5px;
    }
    
    .btn-small {
      padding: 4px 8px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-delete {
      background: #dc3545;
      color: white;
    }
    
    .btn-delete:hover {
      background: #c82333;
    }
    
    .btn-edit {
      background: #ffc107;
      color: #333;
    }
    
    .btn-edit:hover {
      background: #e0a800;
    }
    
    .api-item-details {
      font-size: 11px;
      color: #666;
    }
    
    .status {
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 15px;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    
    .empty-state-text {
      font-size: 14px;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 AI新闻总结小助手</h1>
      <p>智能总结新闻内容，一键获取核心信息</p>
    </div>
    
    <div class="tabs">
      <div class="tab active" data-tab="summary">新闻摘要</div>
      <div class="tab" data-tab="config">API配置</div>
    </div>
    
    <div class="tab-content active" id="summary-tab">
      <div id="status-message"></div>
      
      <div class="form-group">
        <label>选择API</label>
        <select id="api-selector">
          <option value="">请先配置API</option>
        </select>
      </div>
      
      <div class="summary-section">
        <div class="summary-label">新闻标题</div>
        <div class="summary-content" id="news-title">点击下方按钮获取新闻内容</div>
      </div>
      
      <div class="summary-section">
        <div class="summary-label">AI摘要</div>
        <div class="summary-content" id="summary-result">等待生成摘要...</div>
      </div>
      
      <button class="btn btn-primary" id="extract-btn">提取新闻内容</button>
      <button class="btn btn-primary" id="summarize-btn" disabled>生成AI摘要</button>
    </div>
    
    <div class="tab-content" id="config-tab">
      <div id="config-status"></div>
      
      <div class="form-group">
        <label>API名称</label>
        <input type="text" id="api-name" placeholder="例如：OpenAI、DeepSeek等">
      </div>
      
      <div class="form-group">
        <label>API地址</label>
        <input type="text" id="api-url" placeholder="https://api.openai.com/v1/chat/completions">
      </div>
      
      <div class="form-group">
        <label>模型名称</label>
        <input type="text" id="api-model" placeholder="gpt-3.5-turbo">
      </div>
      
      <div class="form-group">
        <label>API密钥</label>
        <input type="password" id="api-key" placeholder="sk-xxxxxxxxxxxx">
      </div>
      
      <button class="btn btn-primary" id="add-api-btn">添加API配置</button>
      <button class="btn btn-secondary" id="cancel-edit-btn" style="display: none;">取消编辑</button>
      
      <div class="api-list" id="api-list">
        <div class="empty-state">
          <div class="empty-state-icon">📝</div>
          <div class="empty-state-text">暂无API配置，请添加</div>
        </div>
      </div>
      
      <button class="btn btn-secondary" id="clear-all-btn">清空所有配置</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
