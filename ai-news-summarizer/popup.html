<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #1890ff;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
    
    .api-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      padding: 8px;
    }
    
    .api-item {
      padding: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .api-item:last-child {
      border-bottom: none;
    }
    
    .api-name {
      font-weight: bold;
      margin-bottom: 4px;
    }
    
    .api-details {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    
    .api-status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 10px;
      color: white;
    }
    
    .status-enabled {
      background-color: #52c41a;
    }
    
    .status-disabled {
      background-color: #ff4d4f;
    }
    
    .button {
      background-color: #1890ff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    
    .button:hover {
      background-color: #40a9ff;
    }
    
    .button-secondary {
      background-color: #52c41a;
    }
    
    .button-secondary:hover {
      background-color: #73d13d;
    }
    
    .button-danger {
      background-color: #ff4d4f;
    }
    
    .button-danger:hover {
      background-color: #ff7875;
    }
    
    .current-page {
      margin-bottom: 16px;
      padding: 8px;
      background-color: #f6f6f6;
      border-radius: 4px;
    }
    
    .page-title {
      font-weight: bold;
      margin-bottom: 4px;
    }
    
    .page-url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }
    
    .summary-result {
      margin-top: 16px;
      padding: 12px;
      background-color: #f6f6f6;
      border-radius: 4px;
      border-left: 4px solid #1890ff;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    
    .error {
      color: #ff4d4f;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI新闻总结助手</h1>
  </div>
  
  <div id="current-page" class="current-page">
    <div class="page-title">当前页面</div>
    <div id="page-url" class="page-url">检测中...</div>
  </div>
  
  <div class="section">
    <div class="section-title">API配置</div>
    <div id="api-list" class="api-list">
      <div class="loading">加载中...</div>
    </div>
    <div style="margin-top: 8px;">
      <button id="add-api" class="button button-secondary">添加API</button>
      <button id="manage-apis" class="button">管理API</button>
    </div>
  </div>
  
  <div class="section">
    <button id="summarize-btn" class="button">总结当前新闻</button>
    <button id="options-btn" class="button">高级设置</button>
  </div>
  
  <div id="summary-result" class="summary-result" style="display: none;">
    <div class="section-title">AI总结结果</div>
    <div id="summary-content"></div>
  </div>
  
  <div id="error-message" class="error"></div>
  
  <script src="popup.js"></script>
</body>
</html>
