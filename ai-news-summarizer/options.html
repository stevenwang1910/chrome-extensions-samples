<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI新闻总结助手 - 设置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      margin: 0;
      color: #1890ff;
    }
    
    .section {
      margin-bottom: 30px;
    }
    
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
      border-bottom: 1px solid #e8e8e8;
      padding-bottom: 8px;
    }
    
    .api-list {
      margin-bottom: 20px;
    }
    
    .api-item {
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
      background-color: #fafafa;
    }
    
    .api-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .api-name {
      font-weight: bold;
      font-size: 16px;
    }
    
    .api-actions {
      display: flex;
      gap: 8px;
    }
    
    .button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .button-primary {
      background-color: #1890ff;
      color: white;
    }
    
    .button-primary:hover {
      background-color: #40a9ff;
    }
    
    .button-danger {
      background-color: #ff4d4f;
      color: white;
    }
    
    .button-danger:hover {
      background-color: #ff7875;
    }
    
    .button-success {
      background-color: #52c41a;
      color: white;
    }
    
    .button-success:hover {
      background-color: #73d13d;
    }
    
    .api-details {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .api-detail-label {
      font-weight: bold;
      color: #666;
    }
    
    .api-detail-value {
      word-break: break-all;
    }
    
    .api-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 12px;
      color: white;
    }
    
    .status-enabled {
      background-color: #52c41a;
    }
    
    .status-disabled {
      background-color: #ff4d4f;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }
    
    .form-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .form-checkbox {
      margin-right: 8px;
    }
    
    .add-api-form {
      border: 1px dashed #d9d9d9;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 20px;
      background-color: #f9f9f9;
    }
    
    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .notification {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    
    .notification-success {
      background-color: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #52c41a;
    }
    
    .notification-error {
      background-color: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
    }
    
    .hidden {
      display: none;
    }
    
    .template {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>AI新闻总结助手 - 设置</h1>
    </div>
    
    <div id="notification" class="notification hidden"></div>
    
    <div class="section">
      <div class="section-title">API配置管理</div>
      
      <div class="add-api-form hidden" id="add-api-form">
        <h3>添加新的API配置</h3>
        <div class="form-group">
          <label class="form-label" for="api-name">配置名称</label>
          <input type="text" id="api-name" class="form-input" placeholder="例如：OpenAI API">
        </div>
        <div class="form-group">
          <label class="form-label" for="api-url">API地址</label>
          <input type="text" id="api-url" class="form-input" placeholder="https://api.openai.com/v1/chat/completions">
        </div>
        <div class="form-group">
          <label class="form-label" for="api-model">模型名称</label>
          <input type="text" id="api-model" class="form-input" placeholder="gpt-3.5-turbo">
        </div>
        <div class="form-group">
          <label class="form-label" for="api-key">API密钥</label>
          <input type="password" id="api-key" class="form-input" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="api-enabled" class="form-checkbox" checked>
            启用此API配置
          </label>
        </div>
        <div class="form-actions">
          <button id="save-api" class="button button-primary">保存配置</button>
          <button id="cancel-add-api" class="button">取消</button>
        </div>
      </div>
      
      <div style="margin-bottom: 16px;">
        <button id="show-add-form" class="button button-success">添加新API</button>
      </div>
      
      <div id="api-list" class="api-list">
        <!-- API配置列表将在这里动态生成 -->
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">使用说明</div>
      <div>
        <p>1. 配置至少一个API密钥才能使用AI总结功能</p>
        <p>2. 支持OpenAI兼容格式的API接口</p>
        <p>3. 可以配置多个API渠道，但只能同时启用一个</p>
        <p>4. 在网易新闻页面点击"AI总结新闻"按钮即可生成摘要</p>
      </div>
    </div>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
