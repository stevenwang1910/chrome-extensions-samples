<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纯净阅读模式</title>
  <style>
    body {
      width: 200px;
      padding: 15px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #333;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    #enableBtn {
      background: #0078d4;
      color: white;
    }
    #enableBtn:hover {
      background: #005a9e;
    }
    #disableBtn {
      background: #e0e0e0;
      color: #333;
    }
    #disableBtn:hover {
      background: #d0d0d0;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    .status.active {
      background: #d4edda;
      color: #155724;
    }
    .status.inactive {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h3>纯净阅读模式</h3>
  <div class="button-group">
    <button id="enableBtn">启用纯净阅读</button>
    <button id="disableBtn">禁用纯净阅读</button>
  </div>
  <div id="status" class="status inactive">当前未启用</div>
  <script src="popup.js"></script>
</body>
</html>
