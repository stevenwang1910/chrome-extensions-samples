<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 12px;
            color: #666;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .toggle-label {
            font-size: 13px;
            color: #555;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background-color: #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .toggle-switch.active {
            background-color: #e74c3c;
        }
        
        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active .toggle-slider {
            transform: translateX(26px);
        }
        
        .button {
            width: 100%;
            padding: 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #c0392b;
        }
        
        .button.secondary {
            background-color: #6c757d;
            margin-top: 10px;
        }
        
        .button.secondary:hover {
            background-color: #5a6268;
        }
        
        .status {
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
        }
        
        .status.enabled {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status.disabled {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .footer {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">网易新闻纯净阅读</div>
        <div class="subtitle">专注于内容，去除干扰</div>
    </div>
    
    <div class="section">
        <div class="section-title">设置</div>
        <div class="toggle-container">
            <div class="toggle-label">自动启用阅读模式</div>
            <div id="autoEnableToggle" class="toggle-switch">
                <div class="toggle-slider"></div>
            </div>
        </div>
    </div>
    
    <div class="section">
        <button id="toggleReadingMode" class="button">切换阅读模式</button>
        <button id="resetSettings" class="button secondary">重置设置</button>
    </div>
    
    <div id="statusMessage" class="status"></div>
    
    <div class="footer">
        版本 1.0 | 适用于网易新闻网站
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
