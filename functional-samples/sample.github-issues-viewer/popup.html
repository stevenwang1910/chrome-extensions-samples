<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 800px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #24292e;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .refresh-btn {
      background: #2ea44f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .refresh-btn:hover {
      background: #2c974b;
    }
    .table-container {
      max-height: 500px;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #d0d7de;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f6f8fa;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    tr:nth-child(even) {
      background: #f6f8fa;
    }
    .status-open {
      color: #22863a;
      font-weight: 600;
    }
    .status-closed {
      color: #cb2431;
      font-weight: 600;
    }
    .issue-id {
      color: #0969da;
      font-weight: 600;
    }
    .issue-title {
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #loading {
      text-align: center;
      padding: 20px;
      color: #57606a;
    }
    #error {
      color: #cb2431;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GitHub Issues</h1>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
  <div id="loading">Loading...</div>
  <div id="error" style="display: none;"></div>
  <div class="table-container" id="tableContainer" style="display: none;">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="issueTableBody">
      </tbody>
    </table>
  </div>
  <script src="popup.js"></script>
</body>
</html>
