<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 650px;
      background: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e1e4e8;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: #24292e;
    }
    .repo-info {
      font-size: 12px;
      color: #586069;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
    }
    th {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      padding: 8px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #24292e;
      white-space: nowrap;
    }
    td {
      border: 1px solid #e1e4e8;
      padding: 8px 12px;
      font-size: 12px;
      color: #24292e;
    }
    tr:hover {
      background: #f6f8fa;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #586069;
      font-size: 14px;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-left: 10px;
      border: 2px solid #e1e4e8;
      border-top-color: #0366d6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-open {
      color: #22863a;
      font-weight: 600;
    }
    .status-closed {
      color: #d73a49;
      font-weight: 600;
    }
    .issue-id {
      color: #586069;
    }
    .issue-title {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .author {
      color: #586069;
    }
    .date {
      color: #6a737d;
      white-space: nowrap;
    }
    #debug {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading issues</div>
  <div id="content" style="display: none;">
    <div class="header">
      <h1>GitHub Issues</h1>
      <div id="repoInfo" class="repo-info"></div>
    </div>
    <table id="issuesTable">
      <thead>
        <tr>
          <th style="width: 60px;">ID</th>
          <th style="width: 70px;">Status</th>
          <th>Title</th>
          <th style="width: 100px;">Author</th>
          <th style="width: 100px;">Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="debug"></div>
  <script src="popup.js"></script>
</body>
</html>
