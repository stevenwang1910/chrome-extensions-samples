<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      padding: 10px;
      width: 600px;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #24292e;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #e1e4e8;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f6f8fa;
      font-weight: 600;
      color: #24292e;
    }
    td {
      color: #24292e;
    }
    tr:hover {
      background-color: #f6f8fa;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #586069;
    }
    .debug {
      margin-top: 10px;
      padding: 10px;
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      border-radius: 3px;
    }
    .no-issues {
      text-align: center;
      padding: 20px;
      color: #586069;
    }
    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
    }
    .status-open {
      background-color: #f0fff4;
      color: #22863a;
      border: 1px solid #34d058;
    }
    .status-closed {
      background-color: #ffeef0;
      color: #cb2431;
      border: 1px solid #ff7b72;
    }
  </style>
</head>
<body>
  <h1>GitHub Issues</h1>
  <div id="loading" class="loading">Loading...</div>
  <div id="content" style="display: none;">
    <table id="issuesTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Status</th>
          <th>Title</th>
          <th>Author</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="debug" class="debug" style="display: none;">
    <h3>Debug Info:</h3>
    <div id="debugLog"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
