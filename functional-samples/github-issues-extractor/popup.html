<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      width: 600px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
      font-size: 12px;
    }
    td {
      font-size: 11px;
    }
    .loading {
      text-align: center;
      padding: 20px;
    }
    .debug {
      margin-top: 10px;
      padding: 10px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      font-size: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>GitHub Issues</h1>
  <button id="refreshButton" style="margin-bottom: 10px; padding: 5px 10px; cursor: pointer;">🔄 Refresh</button>
  <div id="loading" class="loading">Loading...</div>
  <div id="content" style="display: none;">
    <table id="issuesTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Status</th>
          <th>Title</th>
          <th>Author</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="debug" class="debug" style="display: none;">
    <h3>Debug Info:</h3>
    <div id="debugLog"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
