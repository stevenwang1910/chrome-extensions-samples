<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      width: 700px;
      max-height: 600px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e1e4e8;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: #24292e;
    }
    #issueCount {
      font-size: 14px;
      color: #586069;
      font-weight: normal;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #e1e4e8;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f6f8fa;
      font-weight: 600;
      color: #24292e;
      font-size: 12px;
    }
    td {
      color: #24292e;
    }
    tbody tr:hover {
      background-color: #f6f8fa;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #586069;
      font-size: 14px;
    }
    .debug {
      margin-top: 16px;
      padding: 12px;
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
    }
    .debug h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #586069;
    }
    .debug pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .status-open {
      color: #22863a;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-open::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #22863a;
      -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/><path fill-rule="evenodd" d="M8 0a8 8 0 100 16 8 8 0 000-16zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/></svg>');
      mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/><path fill-rule="evenodd" d="M8 0a8 8 0 100 16 8 8 0 000-16zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/></svg>');
    }
    .status-closed {
      color: #d73a49;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-closed::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #d73a49;
      -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M10.72 11.622a.75.75 0 01-1.061.05L8 9.56l-1.659 2.113a.75.75 0 11-1.11-1.001L7.067 8.5H3.75a.75.75 0 010-1.5h3.317L5.23 5.388a.75.75 0 111.11-1.001L8 6.44l1.659-2.053a.75.75 0 111.11 1.001L8.933 7H12.25a.75.75 0 010 1.5H8.933l1.838 2.112a.75.75 0 01-.05 1.01z"/><path fill-rule="evenodd" d="M8 16A8 8 0 108 0a8 8 0 000 16zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/></svg>');
      mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M10.72 11.622a.75.75 0 01-1.061.05L8 9.56l-1.659 2.113a.75.75 0 11-1.11-1.001L7.067 8.5H3.75a.75.75 0 010-1.5h3.317L5.23 5.388a.75.75 0 111.11-1.001L8 6.44l1.659-2.053a.75.75 0 111.11 1.001L8.933 7H12.25a.75.75 0 010 1.5H8.933l1.838 2.112a.75.75 0 01-.05 1.01z"/><path fill-rule="evenodd" d="M8 16A8 8 0 108 0a8 8 0 000 16zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/></svg>');
    }
    #issuesTable td:nth-child(4) {
      color: #586069;
    }
    #issuesTable td:nth-child(5) {
      color: #586069;
      white-space: nowrap;
    }
    .issue-link {
      color: #0366d6;
      text-decoration: none;
    }
    .issue-link:hover {
      text-decoration: underline;
    }
    .author-link {
      color: #586069;
      text-decoration: none;
    }
    .author-link:hover {
      color: #0366d6;
      text-decoration: underline;
    }
    .table-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
    }
    table {
      margin-bottom: 0;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      box-shadow: 0 1px 0 #e1e4e8;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #586069;
    }
    .toggle-debug {
      margin-top: 12px;
      padding: 6px 12px;
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #586069;
    }
    .toggle-debug:hover {
      background: #e1e4e8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GitHub Issues <span id="issueCount"></span></h1>
  </div>
  <div id="loading" class="loading">Loading...</div>
  <div id="content" style="display: none;">
    <div class="table-container">
      <table id="issuesTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Status</th>
            <th>Title</th>
            <th>Author</th>
            <th>Date</th>
            <th>URL</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button id="toggleDebug" class="toggle-debug">Toggle Debug Info</button>
  </div>
  <div id="debug" class="debug" style="display: none;">
    <h3>Debug Info:</h3>
    <div id="debugLog"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
