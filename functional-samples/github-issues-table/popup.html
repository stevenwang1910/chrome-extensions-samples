<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Table</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 800px;
        min-height: 400px;
        max-height: 600px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #24292f;
      }

      .header {
        padding: 16px;
        background: #f6f8fa;
        border-bottom: 1px solid #d1d9e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 600;
        color: #24292f;
      }

      .refresh-btn {
        padding: 6px 12px;
        background: #2da44e;
        color: white;
        border: 1px solid rgba(27, 31, 36, 0.15);
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      .refresh-btn:hover {
        background: #2c974b;
      }

      .refresh-btn:disabled {
        background: #94d3a2;
        cursor: not-allowed;
      }

      .container {
        padding: 16px;
        max-height: 500px;
        overflow-y: auto;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #656d76;
        font-size: 14px;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #d1d9e0;
        border-top-color: #2da44e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        padding: 20px;
        background: #fffbe6;
        border: 1px solid #ffd33d;
        border-radius: 6px;
        color: #9a6700;
        font-size: 14px;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #656d76;
      }

      .empty-state svg {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        opacity: 0.5;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th {
        background: #f6f8fa;
        padding: 8px 12px;
        text-align: left;
        font-weight: 600;
        color: #24292f;
        border: 1px solid #d1d9e0;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      td {
        padding: 8px 12px;
        border: 1px solid #d1d9e0;
        vertical-align: top;
      }

      tr:hover td {
        background: #f6f8fa;
      }

      .status-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
      }

      .status-open {
        background: #2da44e;
        color: white;
      }

      .status-closed {
        background: #cf222e;
        color: white;
      }

      .status-pr {
        background: #8250df;
        color: white;
      }

      .status-draft {
        background: #656d76;
        color: white;
      }

      .status-merged {
        background: #8250df;
        color: white;
      }

      .issue-id {
        color: #0969da;
        font-weight: 500;
        text-decoration: none;
      }

      .issue-id:hover {
        text-decoration: underline;
      }

      .issue-title {
        max-width: 300px;
        word-break: break-word;
      }

      .submitter {
        color: #0969da;
        text-decoration: none;
      }

      .submitter:hover {
        text-decoration: underline;
      }

      .date {
        color: #656d76;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>GitHub Issues Table</h1>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
    <div class="container" id="container">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading issues...</p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
